[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{name = "Vincent QB", email = "vincentqb@gmail.com"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "rich",
  "typer"
]
description = "dot.py is a minimalist python script for managing dotfiles via symbolic links."
dynamic = ["version"]
name = "dot.py"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "coverage[toml]",
  "pytest>=8.3.3",
  "pytest-cov"
]

[project.scripts]
"dot.py" = "_dot:dot_from_args"

[project.urls]
"Homepage" = "https://github.com/vincentqb/dot.py/"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.run]
source = ["dot"]

[tool.hatch.build]
only-include = ["dot.py", "_dot.py"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = "--cov=dot"

[tool.pytype]
inputs = ["dot.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["C901", "I", "RUF022"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
invalid-assignment = "warn"
missing-argument = "ignore"
unresolved-attribute = "warn"
unresolved-import = "warn"

[tool.uv]
package = true
