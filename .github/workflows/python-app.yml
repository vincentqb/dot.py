name: test and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: astral-sh/setup-uv@v6.3.1
    - run: uv tool run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: astral-sh/setup-uv@v6.3.1
    - run: uv sync --extra test
    - run: uv run pytest

  publish:
    name: Publish
    environment:
      name: pypi
      url: https://pypi.org/project/dot.py/
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0  # needed for git describe
    - uses: astral-sh/setup-uv@v6.3.1
    - name: Build
      run: uv build
    - name: Validate tag
      run: uv run --with dist/*.whl python tests/versions.py
    - name: Publish
      run: uv publish --trusted-publishing always
